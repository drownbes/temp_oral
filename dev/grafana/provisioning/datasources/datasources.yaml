apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    isDefault: true
    jsonData:
      # Trace view -> "Logs for this span" opens VictoriaLogs filtered by trace id
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: 'trace_id:"$${__trace.traceId}"'
      serviceMap:
        datasourceUid: ""
      nodeGraph:
        enabled: true

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://127.0.0.1:9428
    jsonData:
      # Log line -> trace link
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
