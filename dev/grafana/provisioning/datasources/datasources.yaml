apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    isDefault: true
    jsonData:
      # Trace view -> "Logs for this span" opens VictoriaLogs filtered by trace id
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: 'trace_id:"$${__trace.traceId}"'
      # Service graph metrics from Tempo's metrics generator
      serviceMap:
        datasourceUid: victoriametrics
      nodeGraph:
        enabled: true
      # Trace view -> rate/latency of that span from the span metrics
      tracesToMetrics:
        datasourceUid: victoriametrics
        spanStartTimeShift: -15m
        spanEndTimeShift: 15m
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags, span_name="$${__span.name}"}[1m]))'
          - name: p95 latency
            query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags, span_name="$${__span.name}"}[1m])))'

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://127.0.0.1:9428
    jsonData:
      # Log line -> trace link
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"

  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://127.0.0.1:8428
    jsonData:
      prometheusType: Prometheus
      timeInterval: 10s
